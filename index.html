<script>
// --- [ブロック名：状態管理・DOM要素取得JS] ここから ---
const state = {
  keyword: '',
  meridian: '',
  selectedTags: new Set(),
  redSheetActive: false,
  viewMode: 'single',
  filteredList: [],
  currentIndex: 0
};

const keywordInput = document.getElementById('keywordInput');
const clearSearchBtn = document.getElementById('clearSearchBtn');
const meridianSelect = document.getElementById('meridianSelect');
const youketsuChips = document.getElementById('youketsuChips');
const resetAllBtn = document.getElementById('resetAllBtn');
const redSheetToggle = document.getElementById('redSheetToggle');
const resultCount = document.getElementById('resultCount');
const cardsGrid = document.getElementById('cardsGrid');
const tabListView = document.getElementById('tabListView');
const tabSingleView = document.getElementById('tabSingleView');
const singleNavBar = document.getElementById('singleNavBar');
const prevCardBtn = document.getElementById('prevCardBtn');
const nextCardBtn = document.getElementById('nextCardBtn');
const shuffleCardBtn = document.getElementById('shuffleCardBtn');
const singlePageText = document.getElementById('singlePageText');
// --- [ブロック名：状態管理・DOM要素取得JS] ここまで ---

// --- [ブロック名：検索フィルタリング処理JS] ここから ---
function normalizeText(str) {
  return String(str || '').toLowerCase().replace(/\s+/g, '');
}

function matchesYouketsu(youketsuText, selectedSet) {
  if (selectedSet.size === 0) return true;
  if (!youketsuText) return false;
  for (const tag of selectedSet) {
    if (tag === '井' || tag === '榮' || tag === '兪' || tag === '経' || tag === '合') {
      if (youketsuText.includes(tag + '木穴') ||
          youketsuText.includes(tag + '火穴') ||
          youketsuText.includes(tag + '土穴') ||
          youketsuText.includes(tag + '金穴') ||
          youketsuText.includes(tag + '水穴')) {
        return true;
      }
    } else if (youketsuText.includes(tag)) {
      return true;
    }
  }
  return false;
}

function filterAcupoints() {
  if (typeof ACUPOINT_DATA === 'undefined' || !Array.isArray(ACUPOINT_DATA)) {
    cardsGrid.innerHTML = '<p>データファイル（acupoints_data.js）が読み込まれていません。index.html と同じフォルダに配置してください。</p>';
    return;
  }

  const kw = normalizeText(state.keyword);
  state.filteredList = ACUPOINT_DATA.filter(item => {
    if (state.meridian && item.m !== state.meridian) return false;
    if (!matchesYouketsu(item.y, state.selectedTags)) return false;
    if (kw) {
      const target = normalizeText(item.n + item.r + item.m + item.y + item.p + item.t + item.a);
      if (!target.includes(kw)) return false;
    }
    return true;
  });

  state.currentIndex = 0;
  renderCards();
}
// --- [ブロック名：検索フィルタリング処理JS] ここまで ---

// --- [ブロック名：カード描画・赤シート・単体表示制御JS] ここから ---
function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function createCardHtml(item) {
  const isKiketsu = item.m.startsWith('奇穴');
  const anatomyLabel = isKiketsu ? '主治' : '解剖（筋・神経・血管）';
  const youketsuHtml = item.y
    ? '<div><span class="youketsu-tag">' + escapeHtml(item.y) + '</span></div>'
    : '';

  return [
    '<article class="acupoint-card">',
    '  <div class="card-top">',
    '    <div class="point-name-wrap">',
    '      <span class="point-reading">' + escapeHtml(item.r) + '</span>',
    '      <h2 class="point-name">' + escapeHtml(item.n) + '</h2>',
    '    </div>',
    '    <span class="meridian-badge">' + escapeHtml(item.m) + '</span>',
    '  </div>',
    youketsuHtml,
    '  <div class="detail-row">',
    '    <span class="detail-label">部位</span>',
    '    <div class="detail-text maskable">' + escapeHtml(item.p) + '</div>',
    '  </div>',
    '  <div class="detail-row">',
    '    <span class="detail-label">取り方</span>',
    '    <div class="detail-text maskable">' + escapeHtml(item.t) + '</div>',
    '  </div>',
    '  <div class="detail-row">',
    '    <span class="detail-label">' + anatomyLabel + '</span>',
    '    <div class="detail-text maskable">' + escapeHtml(item.a) + '</div>',
    '  </div>',
    '</article>'
  ].join('');
}

function renderCards() {
  const list = state.filteredList;
  resultCount.textContent = list.length;

  if (list.length === 0) {
    cardsGrid.classList.remove('is-single-view');
    singleNavBar.style.display = 'none';
    cardsGrid.innerHTML = '<div class="acupoint-card"><p>条件に一致する経穴が見つかりませんでした。検索ワードや絞り込み条件を変更してください。</p></div>';
    return;
  }

  if (state.viewMode === 'single') {
    cardsGrid.classList.add('is-single-view');
    singleNavBar.style.display = 'flex';
    const currentItem = list.at(state.currentIndex);
    cardsGrid.innerHTML = createCardHtml(currentItem);
    singlePageText.textContent = (state.currentIndex + 1) + ' / ' + list.length + ' 枚目';
    prevCardBtn.disabled = state.currentIndex <= 0;
    nextCardBtn.disabled = state.currentIndex >= list.length - 1;
  } else {
    cardsGrid.classList.remove('is-single-view');
    singleNavBar.style.display = 'none';
    cardsGrid.innerHTML = list.map(createCardHtml).join('');
  }
}

function switchViewMode(mode) {
  state.viewMode = mode;
  const isSingle = mode === 'single';
  tabListView.classList.toggle('is-active', !isSingle);
  tabListView.setAttribute('aria-selected', String(!isSingle));
  tabSingleView.classList.toggle('is-active', isSingle);
  tabSingleView.setAttribute('aria-selected', String(isSingle));
  renderCards();
}

function shuffleFilteredList() {
  if (state.filteredList.length <= 1) return;
  const arr = Array.from(state.filteredList);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = arr.at(i);
    arr[i] = arr.at(j);
    arr[j] = temp;
  }
  state.filteredList = arr;
  state.currentIndex = 0;
  renderCards();
}

function toggleRedSheetMode() {
  state.redSheetActive = !state.redSheetActive;
  document.body.classList.toggle('red-sheet-on', state.redSheetActive);
  redSheetToggle.classList.toggle('is-active', state.redSheetActive);
  redSheetToggle.setAttribute('aria-pressed', String(state.redSheetActive));
  redSheetToggle.textContent = state.redSheetActive
    ? '赤シート暗記モード：ON（タップで個別に開く）'
    : '赤シート暗記モード：OFF';

  const revealedItems = document.querySelectorAll('.maskable.is-revealed');
  revealedItems.forEach(el => el.classList.remove('is-revealed'));
}
// --- [ブロック名：カード描画・赤シート・単体表示制御JS] ここまで ---

// --- [ブロック名：イベントリスナー初期化JS] ここから ---
keywordInput.addEventListener('input', e => {
  state.keyword = e.target.value;
  clearSearchBtn.style.display = state.keyword ? 'block' : 'none';
  filterAcupoints();
});

clearSearchBtn.addEventListener('click', () => {
  keywordInput.value = '';
  state.keyword = '';
  clearSearchBtn.style.display = 'none';
  keywordInput.focus();
  filterAcupoints();
});

meridianSelect.addEventListener('change', e => {
  state.meridian = e.target.value;
  filterAcupoints();
});

youketsuChips.addEventListener('click', e => {
  const btn = e.target.closest('.filter-chip');
  if (!btn) return;
  const tag = btn.dataset.tag;
  if (state.selectedTags.has(tag)) {
    state.selectedTags.delete(tag);
    btn.classList.remove('is-selected');
  } else {
    state.selectedTags.add(tag);
    btn.classList.add('is-selected');
  }
  filterAcupoints();
});

resetAllBtn.addEventListener('click', () => {
  keywordInput.value = '';
  state.keyword = '';
  clearSearchBtn.style.display = 'none';
  meridianSelect.value = '';
  state.meridian = '';
  state.selectedTags.clear();
  document.querySelectorAll('.filter-chip.is-selected').forEach(el => el.classList.remove('is-selected'));
  filterAcupoints();
});

tabListView.addEventListener('click', () => switchViewMode('list'));
tabSingleView.addEventListener('click', () => switchViewMode('single'));

prevCardBtn.addEventListener('click', () => {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    renderCards();
  }
});

nextCardBtn.addEventListener('click', () => {
  if (state.currentIndex < state.filteredList.length - 1) {
    state.currentIndex++;
    renderCards();
  }
});

shuffleCardBtn.addEventListener('click', shuffleFilteredList);

document.addEventListener('keydown', e => {
  if (state.viewMode !== 'single') return;
  if (document.activeElement === keywordInput) return;
  if (e.key === 'ArrowLeft' && state.currentIndex > 0) {
    state.currentIndex--;
    renderCards();
  } else if (e.key === 'ArrowRight' && state.currentIndex < state.filteredList.length - 1) {
    state.currentIndex++;
    renderCards();
  }
});

redSheetToggle.addEventListener('click', toggleRedSheetMode);

cardsGrid.addEventListener('click', e => {
  if (!state.redSheetActive) return;
  const target = e.target.closest('.maskable');
  if (target) {
    target.classList.toggle('is-revealed');
  }
});

// === [新規機能追加エリア：JS] 新しいスクリプトはこの真上に貼り付け ===

document.addEventListener('DOMContentLoaded', filterAcupoints);
</script>
</body>
