<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>経穴臨床手帳｜全393穴 検索・暗記データベース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* --- [ブロック名：デザイン変数・基本設定CSS] ここから --- */
:root {
  --bg-base: #f4f0e6;
  --bg-surface: rgba(255, 253, 249, 0.92);
  --bg-subtle: #e9e3d5;
  --text-main: #1f1d1a;
  --text-muted: #5e584f;
  --border-color: #d6cebe;
  --accent-primary: #1f4232;
  --accent-primary-light: #e3ece7;
  --accent-vermilion: #b53324;
  --accent-vermilion-light: #faeae8;
  --accent-gold: #9a7b3c;
  --sheet-mask: #c23525;
  --sheet-mask-hover: #9e271a;
  --shadow-sm: 0 2px 8px rgba(31, 29, 26, 0.05);
  --shadow-md: 0 10px 28px rgba(31, 29, 26, 0.09);
  --font-serif: "Shippori Mincho", "Yu Mincho", serif;
  --font-sans: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  --radius-sm: 6px;
  --radius-md: 12px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-base);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(181, 51, 36, 0.04) 0%, transparent 42%),
    radial-gradient(circle at 88% 82%, rgba(31, 66, 50, 0.05) 0%, transparent 45%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='washi'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23washi)' opacity='0.032'/%3E%3C/svg%3E");
  color: var(--text-main);
  line-height: 1.7;
  letter-spacing: 0.02em;
  -webkit-font-smoothing: antialiased;
}
/* --- [ブロック名：デザイン変数・基本設定CSS] ここまで --- */

/* --- [ブロック名：ヘッダー・レイアウトCSS] ここから --- */
.app-header {
  background-color: rgba(255, 253, 249, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 12px 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo-wrap {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1.5px solid var(--accent-primary);
  background: linear-gradient(135deg, var(--accent-primary-light) 0%, #fffdf9 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7);
}

.brand-logo-wrap::before {
  content: "経";
  font-family: var(--font-serif);
  font-weight: 800;
  font-size: 1.05rem;
  color: var(--accent-primary);
}

.brand-logo-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.brand-text-wrap {
  display: flex;
  flex-direction: column;
}

.brand-title {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: var(--accent-primary);
  line-height: 1.2;
}

.brand-sub {
  font-size: 0.74rem;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  margin-top: 2px;
}

.red-sheet-toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1.5px solid var(--accent-vermilion);
  background-color: var(--bg-surface);
  color: var(--accent-vermilion);
  font-size: 0.84rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease, box-shadow 0.2s ease;
}

.red-sheet-toggle:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(181, 51, 36, 0.18);
}

.red-sheet-toggle:active {
  transform: scale(0.97);
}

.red-sheet-toggle.is-active {
  background-color: var(--accent-vermilion);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(181, 51, 36, 0.28);
}

.app-container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 18px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}

@media (min-width: 900px) {
  .app-container {
    grid-template-columns: 310px 1fr;
    align-items: start;
    padding: 28px 24px;
  }
  .control-panel {
    position: sticky;
    top: 82px;
  }
}
/* --- [ブロック名：ヘッダー・レイアウトCSS] ここまで --- */

/* --- [ブロック名：検索・絞り込みパネルCSS] ここから --- */
.control-panel {
  background-color: var(--bg-surface);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border-color);
  border-top: 3px solid var(--accent-primary);
  border-radius: var(--radius-md);
  padding: 18px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.filter-group label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--accent-primary);
  letter-spacing: 0.04em;
  margin-bottom: 7px;
}

.filter-group label::before {
  content: "";
  display: inline-block;
  width: 3px;
  height: 12px;
  background-color: var(--accent-vermilion);
  border-radius: 2px;
}

.search-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.search-input {
  width: 100%;
  padding: 10px 36px 10px 12px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 0.92rem;
  background-color: #fbf9f4;
  color: var(--text-main);
  transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
}

.search-input:focus {
  outline: none;
  border-color: var(--accent-primary);
  background-color: #ffffff;
  box-shadow: 0 0 0 3px rgba(31, 66, 50, 0.1);
}

.clear-search-btn {
  position: absolute;
  right: 8px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.1rem;
  cursor: pointer;
  padding: 4px;
  display: none;
}

.select-box {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  background-color: #fbf9f4;
  color: var(--text-main);
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.select-box:focus {
  outline: none;
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px rgba(31, 66, 50, 0.1);
}

.chip-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filter-chip {
  padding: 5px 10px;
  font-size: 0.79rem;
  border-radius: 999px;
  border: 1px solid var(--border-color);
  background-color: #fbf9f4;
  color: var(--text-main);
  cursor: pointer;
  transition: transform 0.15s ease, background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
}

.filter-chip:hover {
  border-color: var(--accent-primary);
  transform: translateY(-1px);
}

.filter-chip.is-selected {
  background-color: var(--accent-primary);
  border-color: var(--accent-primary);
  color: #ffffff;
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(31, 66, 50, 0.22);
}

.reset-all-btn {
  width: 100%;
  padding: 9px;
  background-color: transparent;
  border: 1px dashed var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s ease;
}

.reset-all-btn:hover {
  background-color: var(--bg-subtle);
  border-style: solid;
  color: var(--text-main);
}
/* --- [ブロック名：検索・絞り込みパネルCSS] ここまで --- */

/* --- [ブロック名：経穴カード・赤シートCSS] ここから --- */
.result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-color);
  font-size: 0.88rem;
  color: var(--text-muted);
}

.result-count strong {
  font-family: var(--font-serif);
  color: var(--accent-primary);
  font-size: 1.2rem;
  margin: 0 2px;
}

.cards-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media (min-width: 1120px) {
  .cards-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@keyframes cardReveal {
  0% {
    opacity: 0;
    transform: translateY(10px) scale(0.985);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.acupoint-card {
  background-color: #fffdf9;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 11px;
  position: relative;
  overflow: hidden;
  animation: cardReveal 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
  transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s ease, border-color 0.24s ease;
}

.acupoint-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: linear-gradient(180deg, var(--accent-primary) 0%, var(--accent-gold) 100%);
  opacity: 0.85;
}

.acupoint-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: #bfb5a2;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  border-bottom: 1px solid var(--bg-subtle);
  padding-bottom: 10px;
}

.point-name-wrap {
  display: flex;
  flex-direction: column;
}

.point-reading {
  font-size: 0.76rem;
  color: var(--accent-vermilion);
  font-weight: 500;
  letter-spacing: 0.06em;
  margin-bottom: 1px;
}

.point-name {
  font-family: var(--font-serif);
  font-size: 1.42rem;
  font-weight: 800;
  color: var(--text-main);
  letter-spacing: 0.06em;
  line-height: 1.28;
}

.meridian-badge {
  font-size: 0.75rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  background-color: var(--accent-primary-light);
  color: var(--accent-primary);
  border: 1px solid rgba(31, 66, 50, 0.16);
  white-space: nowrap;
}

.youketsu-tag {
  display: inline-block;
  font-size: 0.76rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 4px;
  background-color: var(--accent-vermilion-light);
  color: var(--accent-vermilion);
  border: 1px solid rgba(181, 51, 36, 0.25);
  letter-spacing: 0.03em;
}

.detail-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.detail-label {
  font-size: 0.74rem;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}

.detail-text {
  font-size: 0.9rem;
  color: var(--text-main);
  padding: 7px 10px;
  background-color: #f7f4ec;
  border-left: 2px solid var(--border-color);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  transition: background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease;
}

body.red-sheet-on .maskable {
  background-color: var(--sheet-mask);
  border-left-color: var(--sheet-mask-hover);
  color: transparent;
  user-select: none;
  cursor: pointer;
  position: relative;
}

body.red-sheet-on .maskable::after {
  content: "タップして確認";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255, 255, 255, 0.92);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.08em;
}

body.red-sheet-on .maskable:hover {
  background-color: var(--sheet-mask-hover);
}

body.red-sheet-on .maskable.is-revealed {
  background-color: var(--accent-vermilion-light);
  border-left-color: var(--accent-vermilion);
  color: var(--text-main);
  user-select: text;
}

body.red-sheet-on .maskable.is-revealed::after {
  display: none;
}
/* --- [ブロック名：経穴カード・赤シートCSS] ここまで --- */

/* --- [ブロック名：1枚ずつ表示タブ・単体カードCSS] ここから --- */
.view-tabs {
  display: inline-flex;
  background-color: var(--bg-subtle);
  padding: 3px;
  border-radius: 999px;
  border: 1px solid var(--border-color);
  gap: 2px;
}

.view-tab-btn {
  padding: 5px 14px;
  font-size: 0.8rem;
  font-weight: 700;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
}

.view-tab-btn.is-active {
  background-color: var(--accent-primary);
  color: #ffffff;
  box-shadow: 0 2px 6px rgba(31, 66, 50, 0.22);
}

.cards-grid.is-single-view {
  grid-template-columns: 1fr;
  max-width: 700px;
  margin: 0 auto;
}

.cards-grid.is-single-view .acupoint-card {
  padding: 24px 26px;
  box-shadow: var(--shadow-md);
  height: 440px;
  overflow-y: auto;
  justify-content: flex-start;
  background-image: radial-gradient(circle at 95% 8%, rgba(154, 123, 60, 0.06) 0%, transparent 45%);
}

.cards-grid.is-single-view .acupoint-card:hover {
  transform: none;
}

.cards-grid.is-single-view .point-name {
  font-size: 1.65rem;
}

@media (max-width: 600px) {
  .cards-grid.is-single-view .acupoint-card {
    height: 400px;
    padding: 18px 18px 18px 20px;
  }
  .cards-grid.is-single-view .point-name {
    font-size: 1.45rem;
  }
}

.single-nav-bar {
  max-width: 700px;
  margin: 16px auto 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.single-nav-btn {
  padding: 9px 16px;
  font-size: 0.84rem;
  font-weight: 700;
  border-radius: 999px;
  border: 1px solid var(--border-color);
  background-color: #fffdf9;
  color: var(--text-main);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.16s ease, background-color 0.16s ease, border-color 0.16s ease;
}

.single-nav-btn:hover:not(:disabled) {
  background-color: var(--accent-primary-light);
  border-color: var(--accent-primary);
  color: var(--accent-primary);
  transform: translateY(-1px);
}

.single-nav-btn:active:not(:disabled) {
  transform: scale(0.97);
}

.single-nav-btn:disabled {
  opacity: 0.38;
  cursor: not-allowed;
}

.single-page-info {
  font-size: 0.86rem;
  font-weight: 700;
  color: var(--text-muted);
  text-align: center;
  display: flex;
  align-items: center;
  gap: 6px;
}
/* --- [ブロック名：1枚ずつ表示タブ・単体カードCSS] ここまで --- */

/* --- [ブロック名：アプリロゴマークCSS] ここから --- */
.brand-logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.brand-logo-icon {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(44, 76, 59, 0.2);
}

.brand-text-group {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
}
/* --- [ブロック名：アプリロゴマークCSS] ここまで --- */
    
/* === [新規機能追加エリア：CSS] 新しいスタイルはこの真上に貼り付け === */
</style>
</head>

<body>
    
<!-- --- [ブロック名：ヘッダー部分HTML] ここから --- -->
<header class="app-header">
  <div class="header-inner">
    <div class="brand-area" style="display: flex; align-items: center; gap: 10px;">
      <img src="assets/logo.png" alt="経穴臨床手帳ロゴ" style="width: 38px; height: 38px; object-fit: contain; border-radius: 8px; flex-shrink: 0;" onerror="this.style.display='none'">
      <div>
        <h1 class="brand-title">経穴臨床手帳</h1>
        <span class="brand-sub">全393穴 検索・暗記データベース</span>
      </div>
    </div>
    <button type="button" id="redSheetToggle" class="red-sheet-toggle" aria-pressed="false">
      赤シート暗記モード：OFF
    </button>
  </div>
</header>
<!-- --- [ブロック名：ヘッダー部分HTML] ここまで --- -->

<main class="app-container">
  <!-- --- [ブロック名：検索・絞り込みパネルHTML] ここから --- -->
  <aside class="control-panel">
    <div class="filter-group">
      <label for="keywordInput">フリーワード検索（穴名・読み・部位・筋肉・神経など）</label>
      <div class="search-input-wrap">
        <input type="text" id="keywordInput" class="search-input" placeholder="例：合谷、前脛骨筋、第4肋間...">
        <button type="button" id="clearSearchBtn" class="clear-search-btn" aria-label="検索文字をクリア">×</button>
      </div>
    </div>

    <div class="filter-group">
      <label for="meridianSelect">所属経絡で絞り込み</label>
      <select id="meridianSelect" class="select-box">
        <option value="">すべての経絡・奇穴（全393穴）</option>
        <optgroup label="奇経（正中線）">
          <option value="督脈">督脈（28穴）</option>
          <option value="任脈">任脈（24穴）</option>
        </optgroup>
        <optgroup label="手の三陰三陽">
          <option value="手の太陰肺経">手の太陰肺経（11穴）</option>
          <option value="手の陽明大腸経">手の陽明大腸経（20穴）</option>
          <option value="手の少陰心経">手の少陰心経（9穴）</option>
          <option value="手の太陽小腸経">手の太陽小腸経（19穴）</option>
          <option value="手の厥陰心包経">手の厥陰心包経（9穴）</option>
          <option value="手の少陽三焦経">手の少陽三焦経（23穴）</option>
        </optgroup>
        <optgroup label="足の三陰三陽">
          <option value="足の陽明胃経">足の陽明胃経（45穴）</option>
          <option value="足の太陰脾経">足の太陰脾経（21穴）</option>
          <option value="足の太陽膀胱経">足の太陽膀胱経（67穴）</option>
          <option value="足の少陰腎経">足の少陰腎経（27穴）</option>
          <option value="足の少陽胆経">足の少陽胆経（44穴）</option>
          <option value="足の厥陰肝経">足の厥陰肝経（14穴）</option>
        </optgroup>
        <optgroup label="奇穴（部位別）">
          <option value="奇穴（頭頸部）">奇穴（頭頸部）（8穴）</option>
          <option value="奇穴（胸腹部）">奇穴（胸腹部）（1穴）</option>
          <option value="奇穴（背部）">奇穴（背部）（10穴）</option>
          <option value="奇穴（上肢部）">奇穴（上肢部）（6穴）</option>
          <option value="奇穴（下肢部）">奇穴（下肢部）（7穴）</option>
        </optgroup>
      </select>
    </div>

    <div class="filter-group">

<!-- === [PART 2 ここまで] この真下に PART 3 を貼り付け === -->
<!-- === [PART 3 ここから] PART 2 の真下に貼り付け === -->
<script>
// --- [ブロック名：状態管理・DOM要素取得JS] ここから ---
const state = {
  keyword: '',
  meridian: '',
  selectedTags: new Set(),
  redSheetActive: false,
  viewMode: 'single',
  filteredList: [],
  currentIndex: 0
};

const keywordInput = document.getElementById('keywordInput');
const clearSearchBtn = document.getElementById('clearSearchBtn');
const meridianSelect = document.getElementById('meridianSelect');
const youketsuChips = document.getElementById('youketsuChips');
const resetAllBtn = document.getElementById('resetAllBtn');
const redSheetToggle = document.getElementById('redSheetToggle');
const resultCount = document.getElementById('resultCount');
const cardsGrid = document.getElementById('cardsGrid');
const tabListView = document.getElementById('tabListView');
const tabSingleView = document.getElementById('tabSingleView');
const singleNavBar = document.getElementById('singleNavBar');
const prevCardBtn = document.getElementById('prevCardBtn');
const nextCardBtn = document.getElementById('nextCardBtn');
const shuffleCardBtn = document.getElementById('shuffleCardBtn');
const singlePageText = document.getElementById('singlePageText');
// --- [ブロック名：状態管理・DOM要素取得JS] ここまで ---

// --- [ブロック名：検索フィルタリング処理JS] ここから ---
function normalizeText(str) {
  return String(str || '').toLowerCase().replace(/\s+/g, '');
}

function matchesYouketsu(youketsuText, selectedSet) {
  if (selectedSet.size === 0) return true;
  if (!youketsuText) return false;
  for (const tag of selectedSet) {
    if (tag === '井' || tag === '榮' || tag === '兪' || tag === '経' || tag === '合') {
      if (youketsuText.includes(tag + '木穴') ||
          youketsuText.includes(tag + '火穴') ||
          youketsuText.includes(tag + '土穴') ||
          youketsuText.includes(tag + '金穴') ||
          youketsuText.includes(tag + '水穴')) {
        return true;
      }
    } else if (youketsuText.includes(tag)) {
      return true;
    }
  }
  return false;
}

function filterAcupoints() {
  if (typeof ACUPOINT_DATA === 'undefined' || !Array.isArray(ACUPOINT_DATA)) {
    cardsGrid.innerHTML = '<p>データファイル（acupoints_data.js）が読み込まれていません。index.html と同じフォルダに配置してください。</p>';
    return;
  }

  const kw = normalizeText(state.keyword);
  state.filteredList = ACUPOINT_DATA.filter(item => {
    if (state.meridian && item.m !== state.meridian) return false;
    if (!matchesYouketsu(item.y, state.selectedTags)) return false;
    if (kw) {
      const target = normalizeText(item.n + item.r + item.m + item.y + item.p + item.t + item.a);
      if (!target.includes(kw)) return false;
    }
    return true;
  });

  state.currentIndex = 0;
  renderCards();
}
// --- [ブロック名：検索フィルタリング処理JS] ここまで ---

// --- [ブロック名：カード描画・赤シート・単体表示制御JS] ここから ---
function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function createCardHtml(item) {
  const isKiketsu = item.m.startsWith('奇穴');
  const anatomyLabel = isKiketsu ? '主治' : '解剖（筋・神経・血管）';
  const youketsuHtml = item.y
    ? '<div><span class="youketsu-tag">' + escapeHtml(item.y) + '</span></div>'
    : '';

  return [
    '<article class="acupoint-card">',
    '  <div class="card-top">',
    '    <div class="point-name-wrap">',
    '      <span class="point-reading">' + escapeHtml(item.r) + '</span>',
    '      <h2 class="point-name">' + escapeHtml(item.n) + '</h2>',
    '    </div>',
    '    <span class="meridian-badge">' + escapeHtml(item.m) + '</span>',
    '  </div>',
    youketsuHtml,
    '  <div class="detail-row">',
    '    <span class="detail-label">部位</span>',
    '    <div class="detail-text maskable">' + escapeHtml(item.p) + '</div>',
    '  </div>',
    '  <div class="detail-row">',
    '    <span class="detail-label">取り方</span>',
    '    <div class="detail-text maskable">' + escapeHtml(item.t) + '</div>',
    '  </div>',
    '  <div class="detail-row">',
    '    <span class="detail-label">' + anatomyLabel + '</span>',
    '    <div class="detail-text maskable">' + escapeHtml(item.a) + '</div>',
    '  </div>',
    '</article>'
  ].join('');
}

function renderCards() {
  const list = state.filteredList;
  resultCount.textContent = list.length;

  if (list.length === 0) {
    cardsGrid.classList.remove('is-single-view');
    singleNavBar.style.display = 'none';
    cardsGrid.innerHTML = '<div class="acupoint-card"><p>条件に一致する経穴が見つかりませんでした。検索ワードや絞り込み条件を変更してください。</p></div>';
    return;
  }

  if (state.viewMode === 'single') {
    cardsGrid.classList.add('is-single-view');
    singleNavBar.style.display = 'flex';
    const currentItem = list.at(state.currentIndex);
    cardsGrid.innerHTML = createCardHtml(currentItem);
    singlePageText.textContent = (state.currentIndex + 1) + ' / ' + list.length + ' 枚目';
    prevCardBtn.disabled = state.currentIndex <= 0;
    nextCardBtn.disabled = state.currentIndex >= list.length - 1;
  } else {
    cardsGrid.classList.remove('is-single-view');
    singleNavBar.style.display = 'none';
    cardsGrid.innerHTML = list.map(createCardHtml).join('');
  }
}

function switchViewMode(mode) {
  state.viewMode = mode;
  const isSingle = mode === 'single';
  tabListView.classList.toggle('is-active', !isSingle);
  tabListView.setAttribute('aria-selected', String(!isSingle));
  tabSingleView.classList.toggle('is-active', isSingle);
  tabSingleView.setAttribute('aria-selected', String(isSingle));
  renderCards();
}

function shuffleFilteredList() {
  if (state.filteredList.length <= 1) return;
  const arr = Array.from(state.filteredList);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = arr.at(i);
    arr[i] = arr.at(j);
    arr[j] = temp;
  }
  state.filteredList = arr;
  state.currentIndex = 0;
  renderCards();
}

function toggleRedSheetMode() {
  state.redSheetActive = !state.redSheetActive;
  document.body.classList.toggle('red-sheet-on', state.redSheetActive);
  redSheetToggle.classList.toggle('is-active', state.redSheetActive);
  redSheetToggle.setAttribute('aria-pressed', String(state.redSheetActive));
  redSheetToggle.textContent = state.redSheetActive
    ? '赤シート暗記モード：ON（タップで個別に開く）'
    : '赤シート暗記モード：OFF';

  const revealedItems = document.querySelectorAll('.maskable.is-revealed');
  revealedItems.forEach(el => el.classList.remove('is-revealed'));
}
// --- [ブロック名：カード描画・赤シート・単体表示制御JS] ここまで ---

// --- [ブロック名：イベントリスナー初期化JS] ここから ---
keywordInput.addEventListener('input', e => {
  state.keyword = e.target.value;
  clearSearchBtn.style.display = state.keyword ? 'block' : 'none';
  filterAcupoints();
});

clearSearchBtn.addEventListener('click', () => {
  keywordInput.value = '';
  state.keyword = '';
  clearSearchBtn.style.display = 'none';
  keywordInput.focus();
  filterAcupoints();
});

meridianSelect.addEventListener('change', e => {
  state.meridian = e.target.value;
  filterAcupoints();
});

youketsuChips.addEventListener('click', e => {
  const btn = e.target.closest('.filter-chip');
  if (!btn) return;
  const tag = btn.dataset.tag;
  if (state.selectedTags.has(tag)) {
    state.selectedTags.delete(tag);
    btn.classList.remove('is-selected');
  } else {
    state.selectedTags.add(tag);
    btn.classList.add('is-selected');
  }
  filterAcupoints();
});

resetAllBtn.addEventListener('click', () => {
  keywordInput.value = '';
  state.keyword = '';
  clearSearchBtn.style.display = 'none';
  meridianSelect.value = '';
  state.meridian = '';
  state.selectedTags.clear();
  document.querySelectorAll('.filter-chip.is-selected').forEach(el => el.classList.remove('is-selected'));
  filterAcupoints();
});

tabListView.addEventListener('click', () => switchViewMode('list'));
tabSingleView.addEventListener('click', () => switchViewMode('single'));

prevCardBtn.addEventListener('click', () => {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    renderCards();
  }
});

nextCardBtn.addEventListener('click', () => {
  if (state.currentIndex < state.filteredList.length - 1) {
    state.currentIndex++;
    renderCards();
  }
});

shuffleCardBtn.addEventListener('click', shuffleFilteredList);

document.addEventListener('keydown', e => {
  if (state.viewMode !== 'single') return;
  if (document.activeElement === keywordInput) return;
  if (e.key === 'ArrowLeft' && state.currentIndex > 0) {
    state.currentIndex--;
    renderCards();
  } else if (e.key === 'ArrowRight' && state.currentIndex < state.filteredList.length - 1) {
    state.currentIndex++;
    renderCards();
  }
});

redSheetToggle.addEventListener('click', toggleRedSheetMode);

cardsGrid.addEventListener('click', e => {
  if (!state.redSheetActive) return;
  const target = e.target.closest('.maskable');
  if (target) {
    target.classList.toggle('is-revealed');
  }
});
// --- [ブロック名：UIギミック・件数カウントアップ演出JS] ここから ---
function animateResultCount(targetValue) {
  const startValue = parseInt(resultCount.textContent, 10) || 0;
  if (startValue === targetValue) return;
  const duration = 260;
  const startTime = performance.now();

  function step(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    resultCount.textContent = Math.round(startValue + (targetValue - startValue) * eased);
    if (progress < 1) {
      requestAnimationFrame(step);
    }
  }
  requestAnimationFrame(step);
}

const originalRenderCards = renderCards;
renderCards = function() {
  originalRenderCards();
  animateResultCount(state.filteredList.length);
  const activeCard = cardsGrid.querySelector('.acupoint-card');
  if (activeCard && state.viewMode === 'single') {
    activeCard.scrollTop = 0;
  }
};
// --- [ブロック名：UIギミック・件数カウントアップ演出JS] ここまで ---

// === [新規機能追加エリア：JS] 新しいスクリプトはこの真上に貼り付け ===

document.addEventListener('DOMContentLoaded', filterAcupoints);
</script>
</body>
</html>
